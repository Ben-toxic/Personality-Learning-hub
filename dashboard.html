<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <script type="importmap">{"imports": {"supabase": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"}}</script>
  <style>body{font-family:Arial;padding:20px}.card{border:1px solid #ddd;padding:15px;margin:10px 0;cursor:pointer}</style>
</head>
<body>
  <h2>Dashboard</h2>
  <button onclick="logout()">Logout</button>
  <div id="courses"></div>
  <div id="adminBtn"></div>

  <script type="module">
    import { supabase } from './supabase.js'

    let userRole = 'member'

    async function loadData() {
      const {data: {user}} = await supabase.auth.getUser()
      if(!user) return window.location = 'index.html'

      const {data: profile} = await supabase.from('profiles').select('role').eq('id', user.id).single()
      userRole = profile?.role || 'member'

      if(userRole === 'admin') {
        document.getElementById('adminBtn').innerHTML = '<button onclick="location=\'admin.html\'">Admin Panel</button>'
      }

      const {data: courses} = await supabase.from('courses').select('*')
      document.getElementById('courses').innerHTML = courses.map(c =>
        `<div class="card" onclick="openCourse('${c.id}')">${c.name}</div>`
      ).join('')
    }

    window.openCourse = id => window.location = `notes-library.html?course=${id}`
    window.logout = async () => {await supabase.auth.signOut(); location='index.html'}

    loadData()
  </script>
</body>
</html>
