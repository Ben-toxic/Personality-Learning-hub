<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Personality Hub</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; background: #f7fbe7; color: #1a2e05; display: flex; }
.sidebar { width: 260px; background: #2d5016; min-height: 100vh; padding: 20px; position: fixed; }
.sidebar h2 { color: #ffeb3b; font-size: 22px; margin-bottom: 5px; }
.sidebar small { color: #a8c49a; }
.nav-section { margin-top: 30px; color: #8bc34a; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
.sidebar a { display: flex; align-items: center; padding: 12px; margin: 5px 0; color: #e8f5e9; text-decoration: none; border-radius: 8px; transition: 0.2s; }
.sidebar a:hover, .sidebar a.active { background: #4caf50; color: #ffeb3b; font-weight: 600; }
.main { margin-left: 260px; padding: 30px; flex: 1; }
.card { background: #ffffff; padding: 25px; border-radius: 12px; margin-bottom: 20px; border-left: 5px solid #4caf50; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.card h3 { color: #2d5016; margin-bottom: 10px; font-size: 32px; }
.card p { color: #5a6c57; }
.btn { background: #ffeb3b; color: #2d5016; padding: 12px 20px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; }
.btn:hover { background: #fdd835; transform: translateY(-2px); }
.profile { position: absolute; bottom: 20px; width: 220px; }
.badge { background: #ffeb3b; color: #2d5016; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; margin-left: auto; }
.logout-btn { margin-top: 10px; background: #f44336; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: 600; }
@media(max-width:768px){ .sidebar{width:0; overflow:hidden} .main{margin-left:0} }
</style>
</head>
<body>
<div class="sidebar">
  <h2>PERSONALITY HUB</h2>
  <small>Learning Platform</small>
  
  <div class="nav-section">Main</div>
  <a href="#" class="active">🏠 Dashboard</a>
  <a href="#">📚 Notes Library</a>
  <a href="#">⬇️ My Quizzes</a>
  
  <div class="nav-section">AI Tools</div>
  <a href="#">🤖 Quiz Bot <span class="badge">5 pts</span></a>
  
  <div class="nav-section">Account</div>
  <a href="#">👤 Profile</a>
  
  <div class="profile">
    <strong id="user">Guest</strong><br>
    <small style="color:#a8c49a">Member</small><br>
    <button onclick="logout()" class="logout-btn">Sign Out</button>
  </div>
</div>

<div class="main">
  <h1 id="welcome">Dashboard</h1>
  
  <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:20px; margin-top:20px;">
    <div class="card">
      <h3>5</h3>
      <p>Quiz Points Left</p>
    </div>
    <div class="card">
      <h3>3</h3>
      <p>Topics Available</p>
    </div>
  </div>
  
  <div class="card" style="margin-top:20px;">
    <h3>Big 5 Personality</h3>
    <p style="margin:10px 0;">Learn about Openness, Conscientiousness, Extraversion, Agreeableness, Neuroticism.</p>
    <button class="btn" onclick="alert('Notes loading soon!')">Start Learning</button>
  </div>
</div>

<script>
document.getElementById('welcome').innerText = 'Welcome, ' + (localStorage.getItem('userName') || 'Guest');
document.getElementById('user').innerText = localStorage.getItem('userName') || 'Guest';
function logout(){ localStorage.clear(); window.location.href='index.html'; }
</script>
</body>
</html>
