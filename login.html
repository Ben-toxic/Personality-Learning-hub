<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Personality Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Welcome Back</h1>
    <p>Enter any name to continue. No password needed for demo.</p>
    <input type="text" id="name" placeholder="Your name" style="width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:8px;">
    <button onclick="login()" class="btn">Enter Dashboard</button>
    <a href="index.html" style="display:block; margin-top:15px; color:#667eea;">← Back</a>
  </div>
  <script>
    function login() {
      let name = document.getElementById('name').value || 'Guest';
      localStorage.setItem('userName', name);
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
