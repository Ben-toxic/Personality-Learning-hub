<!DOCTYPE html>
<html>
<head>
  <title>Notes Library</title>
  <script type="importmap">{"imports": {"supabase": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"}}</script>
  <style>body{font-family:Arial;padding:20px}.card{border:1px solid #ddd;padding:15px;margin:10px 0;cursor:pointer}</style>
</head>
<body>
  <button onclick="history.back()">← Back</button>
  <h2 id="title"></h2>
  <div id="content"></div>

  <script type="module">
    import { supabase } from './supabase.js'
    const params = new URLSearchParams(location.search)
    const courseId = params.get('course')
    const yearId = params.get('year')
    const semesterId = params.get('semester')

    async function load() {
      if(!courseId) return
      if(!yearId) {
        const {data} = await supabase.from('years').select('*').eq('course_id', courseId)
        document.getElementById('title').innerText = 'Select Year'
        document.getElementById('content').innerHTML = data.map(y =>
          `<div class="card" onclick="location='?course=${courseId}&year=${y.id}'">${y.name || 'Year '+y.year_number}</div>`
        ).join('')
      } else if(!semesterId) {
        const {data} = await supabase.from('semesters').select('*').eq('year_id', yearId)
        document.getElementById('title').innerText = 'Select Semester'
        document.getElementById('content').innerHTML = data.map(s =>
          `<div class="card" onclick="location='?course=${courseId}&year=${yearId}&semester=${s.id}'">${s.name || 'Semester '+s.semester_number}</div>`
        ).join('')
      } else {
        const {data} = await supabase.from('files').select('*').eq('semester_id', semesterId)
        document.getElementById('title').innerText = 'Notes'
        document.getElementById('content').innerHTML = data.map(f =>
          `<div class="card"><b>${f.title}</b><br>Category: ${f.category}<br><button onclick="download('${f.file_path}')">Download</button></div>`
        ).join('')
      }
    }

    window.download = async (path) => {
      const {data} = await supabase.storage.from('public-files').createSignedUrl(path, 60)
      window.open(data.signedUrl)
    }

    load()
  </script>
</body>
</html>
