<!DOCTYPE html>
<html>
<head>
  <title>MedLearn Hub - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="importmap">
    {"imports": {"supabase": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"}}
  </script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial}
    body{
      background:linear-gradient(135deg,#0a192f 0%,#112240 100%);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      color:#e6f1ff
    }
    .card{
      background:#0d1b2a;
      border:1px solid #1e3a5f;
      border-radius:16px;
      padding:45px 35px;
      max-width:420px;
      width:100%;
      box-shadow:0 10px 40px rgba(0,0,0,0.5)
    }
    .logo{
      text-align:center;
      font-size:32px;
      font-weight:700;
      color:#00d4aa;
      margin-bottom:8px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px
    }
    .subtitle{
      text-align:center;
      color:#8892b0;
      font-size:14px;
      margin-bottom:35px
    }
    label{
      display:block;
      font-size:12px;
      color:#8892b0;
      margin:20px 0 8px 0;
      font-weight:600;
      letter-spacing:0.5px
    }
    input{
      width:100%;
      padding:14px 16px;
      background:#112240;
      border:1px solid #233554;
      border-radius:8px;
      color:#e6f1ff;
      font-size:15px;
      transition:0.3s
    }
    input:focus{
      border-color:#00d4aa;
      outline:none;
      box-shadow:0 0 0 2px rgba(0,212,170,0.2)
    }
    button{
      width:100%;
      padding:15px;
      margin-top:25px;
      border:none;
      border-radius:8px;
      background:linear-gradient(90deg,#00d4aa 0%,#00a8ff 100%);
      color:#0a192f;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      transition:0.2s
    }
    button:hover{
      transform:translateY(-2px);
      box-shadow:0 8px 20px rgba(0,212,170,0.4)
    }
    .register-text{
      text-align:center;
      margin-top:25px;
      font-size:14px;
      color:#8892b0
    }
    .register-link{
      color:#00d4aa;
      text-decoration:none;
      font-weight:600;
      cursor:pointer
    }
    .register-link:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">❤️‍🩹 MedLearn Hub</div>
    <div class="subtitle">Sign in to your account</div>
    
    <label>EMAIL ADDRESS</label>
    <input type="email" id="email" placeholder="your@email.com">
    
    <label>PASSWORD</label>
    <input type="password" id="password" placeholder="••••">
    
    <button onclick="login()">Sign In</button>
    
    <div class="register-text">
      Don't have an account? <span class="register-link" onclick="signup()">Register here</span>
    </div>
  </div>

  <script type="module">
    import { supabase } from './supabase.js'

    window.signup = async () => {
      const email = document.getElementById('email').value
      const password = document.getElementById('password').value
      if(!email || !password) return alert('Fill both fields')
      const {error} = await supabase.auth.signUp({email, password})
      alert(error? error.message : 'Account created! Check email if confirmation is on.')
    }

    window.login = async () => {
      const email = document.getElementById('email').value
      const password = document.getElementById('password').value
      const {error} = await supabase.auth.signInWithPassword({email, password})
      if(error) alert(error.message)
      else window.location = 'dashboard.html'
    }

    supabase.auth.getSession().then(({data}) => {
      if(data.session) window.location = 'dashboard.html'
    })
  </script>
</body>
</html>
