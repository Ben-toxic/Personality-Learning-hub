<!DOCTYPE html>
<html>
<head>
  <title>MedLearn Hub - Login</title>
  <script type="importmap">
    {"imports": {"supabase": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"}}
  </script>
  <style>
    body{font-family:Arial;max-width:400px;margin:50px auto;padding:20px}
    input,button{width:100%;padding:10px;margin:8px 0}
    button{background:#3b82f6;color:white;border:none;cursor:pointer}
  </style>
</head>
<body>
  <h2>MedLearn Hub</h2>
  <div id="auth">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="signup()">Sign Up</button>
    <button onclick="login()">Login</button>
  </div>

  <script type="module">
    import { supabase } from './supabase.js'

    window.signup = async () => {
      const email = document.getElementById('email').value
      const password = document.getElementById('password').value
      const {error} = await supabase.auth.signUp({email, password})
      alert(error? error.message : 'Check email to confirm!')
    }

    window.login = async () => {
      const email = document.getElementById('email').value
      const password = document.getElementById('password').value
      const {error} = await supabase.auth.signInWithPassword({email, password})
      if(error) alert(error.message)
      else window.location = 'dashboard.html'
    }

    supabase.auth.getSession().then(({data}) => {
      if(data.session) window.location = 'dashboard.html'
    })
  </script>
</body>
</html>
