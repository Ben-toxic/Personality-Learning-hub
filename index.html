<!DOCTYPE html>
<html>
<head>
  <title>MedLearn Hub - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
    body{background:#0a192f;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:#e6f1ff}
    .card{background:#0d1b2a;border:1px solid #1e3a5f;border-radius:16px;padding:45px 35px;max-width:420px;width:100%}
    .logo{text-align:center;font-size:32px;font-weight:700;color:#00d4aa;margin-bottom:8px}
    .subtitle{text-align:center;color:#8892b0;font-size:14px;margin-bottom:35px}
    label{display:block;font-size:12px;color:#8892b0;margin:20px 0 8px 0}
    input{width:100%;padding:14px;background:#112240;border:1px solid #233554;border-radius:8px;color:#e6f1ff;font-size:15px}
    button{width:100%;padding:15px;margin-top:25px;border:none;border-radius:8px;background:#00d4aa;color:#0a192f;font-size:16px;font-weight:700;cursor:pointer}
    .register-text{text-align:center;margin-top:25px;font-size:14px;color:#8892b0}
    .register-link{color:#00d4aa;cursor:pointer}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">❤️‍🩹 MedLearn Hub</div>
    <div class="subtitle">Sign in to your account</div>
    
    <label>EMAIL</label>
    <input type="email" id="email" placeholder="your@email.com">
    
    <label>PASSWORD</label>
    <input type="password" id="password" placeholder="••••">
    
    <button onclick="window.login()">Sign In</button>
    
    <div class="register-text">
      Don't have an account? <span class="register-link" onclick="window.signup()">Register here</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Show any JS errors as alerts
    window.onerror = function(msg) { alert('JS Error: ' + msg); return true; }

    // Load supabase.js and create client
    let supabase;
    try {
      const keys = { SUPABASE_URL: 'https://sqofwolvslresudccrrd.supabase.co', SUPABASE_ANON_KEY: 'sb_publishable_raIKfQoZpcgsAEEcwO10xQ_vEtrWzZh' };
      alert('Step 1: Keys loaded');
      supabase = window.supabase.createClient(keys.SUPABASE_URL, keys.SUPABASE_ANON_KEY);
      alert('Step 2: Supabase connected');
    } catch(e) {
      alert('Failed to connect Supabase: ' + e.message);
    }

    window.signup = async () => {
      alert('Step 3: Register clicked');
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      if(!email || !password) return alert('Fill both fields');
      
      const {error} = await supabase.auth.signUp({email, password});
      alert(error ? 'Register Error: ' + error.message : 'Account created! Now login');
    }

    window.login = async () => {
      alert('Step 3: Login clicked');
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      if(!email || !password) return alert('Fill both fields');
      
      const {error} = await supabase.auth.signInWithPassword({email, password});
      alert(error ? 'Login Error: ' + error.message : 'Success! Redirecting...');
      if(!error) window.location = 'dashboard.html';
    }
  </script>
</body>
</html>
