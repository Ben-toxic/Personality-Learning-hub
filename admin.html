<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
  <script type="importmap">{"imports": {"supabase": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"}}</script>
  <style>body{font-family:Arial;padding:20px} input,select,button{margin:5px 0;padding:8px;width:100%}</style>
</head>
<body>
  <h2>Admin Panel</h2>
  <button onclick="location='dashboard.html'">← Dashboard</button>

  <h3>Add Course</h3>
  <input id="courseName" placeholder="Course name">
  <button onclick="addCourse()">Add</button>

  <h3>Upload File</h3>
  <select id="semesterSelect"></select>
  <input id="fileTitle" placeholder="File title">
  <select id="category"><option>public</option><option>premium</option><option>restricted</option></select>
  <input type="file" id="file">
  <button onclick="upload()">Upload PDF</button>

  <h3>Payment Requests</h3>
  <div id="payments"></div>

  <script type="module">
    import { supabase } from './supabase.js'

    const {data: {user}} = await supabase.auth.getUser()
    const {data: profile} = await supabase.from('profiles').select('role').eq('id', user.id).single()
    if(profile.role!== 'admin') alert('Not admin')

    async function loadSemesters() {
      const {data} = await supabase.from('semesters').select('id,name,years!inner(name,courses!inner(name))')
      document.getElementById('semesterSelect').innerHTML = data.map(s =>
        `<option value="${s.id}">${s.courses.name} > ${s.years.name} > ${s.name}</option>`
      ).join('')
    }

    window.addCourse = async () => {
      const name = document.getElementById('courseName').value
      await supabase.from('courses').insert({name})
      alert('Course added')
    }

    window.upload = async () => {
      const file = document.getElementById('file').files[0]
      const title = document.getElementById('fileTitle').value
      const category = document.getElementById('category').value
      const semester_id = document.getElementById('semesterSelect').value

      const fileName = Date.now() + '-' + file.name
      await supabase.storage.from(category+'-files').upload(fileName, file)

      await supabase.from('files').insert({title, file_path: fileName, category, semester_id})
      alert('Uploaded!')
    }

    loadSemesters()
  </script>
</body>
</html>
